<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Department Data Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f7f7f5; --fg:#1b1f23; --muted:#5d6670; --line:#d9dcdf; --accent:#1f5f8b; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181b; --fg:#e8eaec; --muted:#9aa3ad; --line:#2d3238; --accent:#6fb1dc; --card:#1e2125; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; font:inherit; color:inherit; background:var(--card);
          border:1px solid var(--line); border-radius:6px; }
  button { padding:12px 18px; font:inherit; color:#fff; background:var(--accent); border:0;
           border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .examples { margin:12px 0 28px; color:var(--muted); font-size:.9rem; }
  .examples button { background:none; color:var(--accent); padding:0 10px 0 0; text-decoration:underline; }
  #result > * { margin-top: 20px; }
  .answer { font-size:1.05rem; white-space:pre-wrap; }
  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  table { border-collapse:collapse; width:100%; font-size:.92rem; }
  th, td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  .chart { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px; }
  details { color:var(--muted); font-size:.9rem; }
  code, pre { font:13px/1.5 ui-monospace, monospace; }
  pre { margin:8px 0 0; padding:10px; overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:6px; }
  .link { background:none; color:var(--accent); padding:0; text-decoration:underline; }
  .error { color:#b3261e; }
</style>
</head>
<body>
<main>
  <h1>Department Data Assistant</h1>
  <p class="sub">Ask a question about courses, terms, and enrollment. Sample data only.</p>
  <form id="f">
    <input id="q" aria-label="Your question" placeholder="Which department has the highest average enrollment?" maxlength="500" autofocus>
    <button id="go">Ask</button>
  </form>
  <div class="examples">Try:
    <button class="link" data-q="Which five courses had the highest total enrollment in Fall 2025?">top courses</button>
    <button class="link" data-q="Show average class fill rate by department as a chart.">fill rate chart</button>
    <button class="link" data-q="How did Computer Science enrollment change across terms?">CS trend</button>
  </div>
  <div id="result" aria-live="polite"></div>
</main>
<script>
let chart;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { $('q').value = b.dataset.q; $('f').requestSubmit(); });

$('f').onsubmit = async e => {
  e.preventDefault();
  const question = $('q').value.trim();
  if (!question) return;
  $('go').disabled = true; $('go').textContent = 'Working';
  $('result').innerHTML = '<p class="sub">Asking the database...</p>';
  try {
    const res = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({question})});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    render(data);
  } catch (err) {
    $('result').innerHTML = `<p class="error">${esc(err.message)}</p>`;
  } finally { $('go').disabled = false; $('go').textContent = 'Ask'; }
};

function render(d) {
  let html = `<div class="answer">${esc(d.answer)}</div>`;
  if (d.chart) html += '<div class="chart"><canvas id="c" height="220"></canvas></div>';
  if (d.table && d.table.rows.length) {
    html += '<div class="scroll"><table><thead><tr>' + d.table.columns.map(c => `<th>${esc(c)}</th>`).join('') +
      '</tr></thead><tbody>' + d.table.rows.map(r => '<tr>' + r.map(v => `<td>${esc(v ?? '')}</td>`).join('') + '</tr>').join('') +
      '</tbody></table></div>';
    if (d.table.truncated) html += '<p class="sub">Showing the first 200 rows.</p>';
    html += '<button type="button" class="link" id="csv">Download CSV</button>';
  }
  html += `<details><summary>What the assistant did (${d.steps.length} tool calls, ${d.seconds}s)</summary>` +
    (d.sql ? `<pre>${esc(d.sql)}</pre>` : '') +
    '<pre>' + d.steps.map(s => `${s.ok ? 'ok ' : 'ERR'} ${s.tool}`).join('\n') + '</pre></details>';
  $('result').innerHTML = html;
  if (d.chart) {
    if (chart) chart.destroy();
    chart = new Chart($('c'), {type: d.chart.chart_type,
      data: {labels: d.chart.labels, datasets: [{label: d.chart.title, data: d.chart.values,
             backgroundColor: '#1f5f8b', borderColor: '#1f5f8b'}]},
      options: {plugins: {title: {display: true, text: d.chart.title}, legend: {display: false}}}});
  }
  if ($('csv')) $('csv').onclick = () => {
    const rows = [d.table.columns, ...d.table.rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(','));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.join('\n')], {type:'text/csv'}));
    a.download = 'result.csv'; a.click();
  };
}
</script>
</body>
</html>
